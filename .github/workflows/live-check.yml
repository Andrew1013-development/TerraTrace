name: Live POWER check

# Manual only: calls the real NASA POWER API (8 points, about 8 requests), so it never runs on
# pull requests or deploys. Run it from the Actions tab before submitting, or after a POWER change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:live
