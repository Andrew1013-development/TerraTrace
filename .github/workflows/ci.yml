name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install -r scripts/requirements.txt
      - run: pytest scripts -v
      - run: npm run build
